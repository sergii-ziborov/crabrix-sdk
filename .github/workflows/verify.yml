name: Verify SDKs
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path crates/crabrix/Cargo.toml --check
      - run: cargo test --manifest-path crates/crabrix/Cargo.toml --locked
      - run: cargo clippy --manifest-path crates/crabrix/Cargo.toml --locked --all-targets -- -D warnings
      - run: go test -race ./...
        working-directory: go/crabrix
      - run: go vet ./...
        working-directory: go/crabrix
      - run: npm pack --ignore-scripts --dry-run
